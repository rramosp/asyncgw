version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      - ASYNCGW_ENV_MODE=mock
      - API_PORT=8000
      - UI_PORT=8080
      - BACKENDS_CONFIG_PATH=config/backends.yaml
      - POLICIES_CONFIG_PATH=config/policies.yaml
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - ASYNCGW_ENV_MODE=mock
      - BACKENDS_CONFIG_PATH=config/backends.yaml
      - POLICIES_CONFIG_PATH=config/policies.yaml
    depends_on:
      - gateway
    restart: unless-stopped
