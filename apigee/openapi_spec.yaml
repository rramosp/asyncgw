openapi: 3.0.3
info:
  title: GCP Asynchronous LLM Gateway API
  description: >
    OpenAPI compatible asynchronous gateway for Large Language Model inference on Google Cloud Platform.
    Enables queuing, batch decomposing, Provisioned Throughput routing, BigQuery tracking, and GCS response persistence.
  version: 1.0.0
servers:
  - url: https://api.asyncgw.example.com
    description: Production Apigee Endpoint
  - url: http://localhost:8000
    description: Local Development Server

paths:
  /v1/chat/completions:
    post:
      summary: Submit Asynchronous Chat Completion
      description: Enqueues an OpenAI-compatible chat completion request onto the Pub/Sub queue and tracks in BigQuery.
      operationId: submitChatCompletion
      tags:
        - Inference
      parameters:
        - name: X-Max-Wait-Seconds
          in: header
          required: false
          schema:
            type: integer
            default: 3600
          description: Client-specified maximum wait time before timeout.
        - name: X-Routing-Override
          in: header
          required: false
          schema:
            type: string
          description: Direct backend target ID override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '202':
          description: Request Accepted and Enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSubmitResponse'
        '400':
          description: Invalid Request Body

  /v1/completions:
    post:
      summary: Submit Asynchronous Text Completion
      operationId: submitTextCompletion
      tags:
        - Inference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model: { type: string }
                prompt: { type: string }
                max_tokens: { type: integer, default: 16 }
                max_wait_seconds: { type: integer }
      responses:
        '202':
          description: Request Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSubmitResponse'

  /v1/embeddings:
    post:
      summary: Submit Asynchronous Embeddings Request
      operationId: submitEmbeddings
      tags:
        - Inference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: { type: string }
                input: { type: string }
      responses:
        '202':
          description: Request Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSubmitResponse'

  /v1/batches:
    post:
      summary: Submit Batch Request (OpenAI Batch API Compatible)
      description: Submits a batch of requests. If backend does not support bulk batch, gateway decomposes into individual sub-requests.
      operationId: submitBatch
      tags:
        - Batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '202':
          description: Batch Accepted and Enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSubmitResponse'

  /v1/batches/{batch_id}:
    get:
      summary: Get Batch Status
      operationId: getBatchStatus
      tags:
        - Batch
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch Status Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatusResponse'
        '404':
          description: Batch Not Found

  /v1/batches/{batch_id}/output:
    get:
      summary: Retrieve Batch Output
      operationId: getBatchOutput
      tags:
        - Batch
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reassembled Batch Output JSON
        '202':
          description: Batch Still Processing

  /v1/requests/{request_id}:
    get:
      summary: Poll Request Status
      operationId: getRequestStatus
      tags:
        - Status & Results
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current Request Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatusResponse'
        '404':
          description: Request ID Not Found

  /v1/requests/{request_id}/response:
    get:
      summary: Retrieve Request Response Payload
      operationId: getRequestResponse
      tags:
        - Status & Results
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Completed LLM Response Payload
        '202':
          description: Still Pending / Processing
        '408':
          description: Request Exceeded Maximum Wait Time (Timed Out)
        '500':
          description: Execution Failed

  /healthz:
    get:
      summary: Health & Readiness Check
      tags:
        - System
      responses:
        '200':
          description: Service Healthy

components:
  schemas:
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        name:
          type: string

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          example: gemini-2.0-flash
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          default: 1.0
        max_tokens:
          type: integer
        max_wait_seconds:
          type: integer
          example: 120
        priority:
          type: string
          enum: [low, normal, high]
          default: normal

    AsyncSubmitResponse:
      type: object
      required: [request_id, status, created_at, status_url]
      properties:
        request_id:
          type: string
          example: req_a1b2c3d4e5f6
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, TIMED_OUT]
          example: PENDING
        created_at:
          type: string
          format: date-time
        status_url:
          type: string
          example: /v1/requests/req_a1b2c3d4e5f6
        response_url:
          type: string
          example: /v1/requests/req_a1b2c3d4e5f6/response
        max_wait_seconds:
          type: integer
          example: 120
        model:
          type: string
          example: gemini-2.0-flash
        message:
          type: string

    BatchRequest:
      type: object
      properties:
        endpoint:
          type: string
          default: /v1/chat/completions
        input_file_id:
          type: string
          description: GCS URI or uploaded file ID
        max_wait_seconds:
          type: integer
        requests:
          type: array
          items:
            type: object
            required: [custom_id, method, url, body]
            properties:
              custom_id: { type: string }
              method: { type: string, default: POST }
              url: { type: string }
              body: { type: object }

    RequestStatusResponse:
      type: object
      required: [request_id, status]
      properties:
        request_id:
          type: string
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, TIMED_OUT, CANCELLED]
        model:
          type: string
        elapsed_seconds:
          type: number
        backend_service_id:
          type: string
        response_gcs_uri:
          type: string
        error_message:
          type: string
        content_tokens:
          type: integer
